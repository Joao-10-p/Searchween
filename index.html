<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEARCHWEEN | Lista de Confirmados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Morcegos decorativos -->
    <span class="bat bat-1" aria-hidden="true">🦇</span>
    <span class="bat bat-2" aria-hidden="true">🦇</span>
    <span class="bat bat-3" aria-hidden="true">🦇</span>

    <header>
        <div class="abobora" aria-hidden="true">🎃</div>
        <h1>SEARCHWEEN</h1>
        <h3>Pesquise por confirmados da festa</h3>
    </header>

    <main>
        <section class="cartao">
            <h2>👻 Insira o nome do convidado</h2>

            <form id="form-busca">
                <label for="name">Insira o nome aqui:</label>
                <input type="text" id="name" placeholder="Ex: João Silva" autocomplete="off" required>
                <button type="submit">🔍 Pesquisar</button>
            </form>

            <!-- O JS vai cuidar desta área -->
            <div id="resultado" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <h3>🕸️ Feliz Halloween! 🕸️</h3>
    </footer>

    <script src="script.js"></script>
</body>
</html>
